<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="chocBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF7F0"/>
      <stop offset="100%" stop-color="#EFE6DA"/>
    </linearGradient>
    <linearGradient id="chocBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A2810"/>
      <stop offset="100%" stop-color="#2D1507"/>
    </linearGradient>
    <linearGradient id="chocDrip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#220F04"/>
      <stop offset="100%" stop-color="#140701"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#D4A373"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3A2012" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="600" height="450" rx="16" fill="url(#chocBg)"/>
  <circle cx="300" cy="240" r="190" fill="#FFF4EB" opacity="0.6"/>

  <!-- Cake Stand -->
  <g filter="url(#shadow2)">
    <ellipse cx="300" cy="385" rx="100" ry="14" fill="#D8C8B5"/>
    <ellipse cx="300" cy="380" rx="90" ry="12" fill="#FFFFFF"/>
    <path d="M280 340 L285 380 L315 380 L320 340 Z" fill="#E6DAD0"/>
    <ellipse cx="300" cy="344" rx="180" ry="24" fill="#C9B59E"/>
    <ellipse cx="300" cy="340" rx="180" ry="22" fill="#FFFFFF"/>
    <ellipse cx="300" cy="338" rx="165" ry="18" fill="#FFFBF5"/>
  </g>

  <!-- Cake Body -->
  <g filter="url(#shadow2)">
    <!-- Base Cylinder -->
    <path d="M180 230 C180 280 180 300 180 320 C180 340 420 340 420 320 L420 230 Z" fill="url(#chocBody)"/>
    <ellipse cx="300" cy="230" rx="120" ry="24" fill="#583115"/>
    
    <!-- Rich Glossy Ganache Drips -->
    <path d="M180 230 Q195 270 205 240 Q220 295 235 240 Q250 280 265 235 Q285 305 305 240 Q330 290 345 235 Q365 275 380 235 Q400 285 420 230 Z" fill="url(#chocDrip)"/>
  </g>

  <!-- Chocolate Curls, Cherries & Gold Foil on Top -->
  <g>
    <!-- Dark Glace Cherries -->
    <circle cx="280" cy="205" r="14" fill="#6B0F1A"/>
    <circle cx="276" cy="200" r="3" fill="#FF758F" opacity="0.6"/>
    <path d="M280 195 Q290 170 305 165" stroke="#381D0B" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <circle cx="325" cy="210" r="14" fill="#590D15"/>
    <circle cx="321" cy="205" r="3" fill="#FF758F" opacity="0.6"/>
    <path d="M325 200 Q335 175 320 162" stroke="#381D0B" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Chocolate Shavings / Curls -->
    <path d="M240 215 C230 205 250 190 260 210 C250 220 235 220 240 215" fill="#200B02"/>
    <path d="M340 205 C335 195 360 185 365 205 C355 215 345 215 340 205" fill="#2B1005"/>
    <path d="M295 218 C290 210 310 200 315 218" fill="#1C0801"/>

    <!-- Hazelnuts -->
    <circle cx="255" cy="225" r="8" fill="#D4A373"/>
    <circle cx="345" cy="220" r="8" fill="#C28E5C"/>

    <!-- Gold Leaf -->
    <polygon points="290,195 296,188 300,196 294,200" fill="url(#goldAcc)"/>
    <polygon points="315,190 322,185 325,193 318,197" fill="url(#goldAcc)"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(420, 30)">
    <rect width="150" height="34" rx="17" fill="#FFFFFF" filter="url(#shadow2)"/>
    <text x="75" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#4A2810" text-anchor="middle">🍫 VALRHONA TRUFFLE</text>
  </g>
</svg>
