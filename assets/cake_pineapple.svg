<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pineBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="100%" stop-color="#FDF3DA"/>
    </linearGradient>
    <linearGradient id="pineYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F4A261"/>
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4A3415" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="600" height="450" rx="16" fill="url(#pineBg)"/>
  <circle cx="300" cy="240" r="190" fill="#FFF9E8" opacity="0.6"/>

  <!-- Stand -->
  <g filter="url(#shadow6)">
    <ellipse cx="300" cy="385" rx="100" ry="14" fill="#D8C8B5"/>
    <ellipse cx="300" cy="380" rx="90" ry="12" fill="#FFFFFF"/>
    <path d="M280 340 L285 380 L315 380 L320 340 Z" fill="#E6DAD0"/>
    <ellipse cx="300" cy="344" rx="180" ry="24" fill="#C9B59E"/>
    <ellipse cx="300" cy="340" rx="180" ry="22" fill="#FFFFFF"/>
  </g>

  <!-- Cake Body -->
  <g filter="url(#shadow6)">
    <path d="M180 230 C180 280 180 300 180 320 C180 340 420 340 420 320 L420 230 Z" fill="#FFFDF5"/>
    <ellipse cx="300" cy="230" rx="120" ry="24" fill="#FFFBE6"/>
    <!-- Yellow Pineapple Glaze Swirl -->
    <path d="M180 270 Q240 285 300 275 Q360 285 420 270 L420 282 Q360 297 300 287 Q240 297 180 282 Z" fill="#FFEAA7" opacity="0.7"/>
  </g>

  <!-- Pineapple Rings & Red Cherries on Top -->
  <g>
    <!-- Center Pineapple Slices -->
    <!-- Slice 1 (left) -->
    <ellipse cx="250" cy="210" rx="28" ry="16" fill="none" stroke="url(#pineYellow)" stroke-width="12"/>
    <!-- Slice 2 (center) -->
    <ellipse cx="300" cy="215" rx="30" ry="17" fill="none" stroke="url(#pineYellow)" stroke-width="12"/>
    <!-- Slice 3 (right) -->
    <ellipse cx="350" cy="210" rx="28" ry="16" fill="none" stroke="url(#pineYellow)" stroke-width="12"/>

    <!-- Red Glace Cherries nestled in centers -->
    <circle cx="250" cy="210" r="10" fill="#D90429"/>
    <circle cx="248" cy="207" r="2.5" fill="#FFFFFF"/>
    <circle cx="300" cy="215" r="11" fill="#D90429"/>
    <circle cx="297" cy="211" r="3" fill="#FFFFFF"/>
    <circle cx="350" cy="210" r="10" fill="#D90429"/>
    <circle cx="348" cy="207" r="2.5" fill="#FFFFFF"/>

    <!-- Flaked Almonds / White Chocolate Curls on Rim -->
    <ellipse cx="205" cy="225" rx="12" ry="5" fill="#FCEBD9" transform="rotate(-20 205 225)"/>
    <ellipse cx="395" cy="225" rx="12" ry="5" fill="#FCEBD9" transform="rotate(20 395 225)"/>
  </g>

  <g transform="translate(420, 30)">
    <rect width="150" height="34" rx="17" fill="#FFFFFF" filter="url(#shadow6)"/>
    <text x="75" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#D4A373" text-anchor="middle">🍍 FRESH PINEAPPLE</text>
  </g>
</svg>
