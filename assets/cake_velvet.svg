<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF7F0"/>
      <stop offset="100%" stop-color="#F2E8DC"/>
    </linearGradient>
    <linearGradient id="cakeFrosting" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#FCEBD9"/>
    </linearGradient>
    <linearGradient id="berryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#9D0208"/>
    </linearGradient>
    <linearGradient id="raspberryGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5D8F"/>
      <stop offset="100%" stop-color="#A4133C"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2D4C3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#5C3C2C" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" rx="16" fill="url(#bgGrad)"/>
  <circle cx="300" cy="240" r="190" fill="#FFF8F0" opacity="0.6"/>

  <!-- Cake Stand -->
  <g filter="url(#shadow)">
    <!-- Stand Foot -->
    <ellipse cx="300" cy="385" rx="100" ry="14" fill="#D8C8B5"/>
    <ellipse cx="300" cy="380" rx="90" ry="12" fill="url(#plateGrad)"/>
    <!-- Pillar -->
    <path d="M280 340 L285 380 L315 380 L320 340 Z" fill="#E6DAD0"/>
    <!-- Plate Rim & Top -->
    <ellipse cx="300" cy="344" rx="180" ry="24" fill="#C9B59E"/>
    <ellipse cx="300" cy="340" rx="180" ry="22" fill="url(#plateGrad)"/>
    <ellipse cx="300" cy="338" rx="165" ry="18" fill="#FFFDF9"/>
  </g>

  <!-- Cake Base Shadow -->
  <ellipse cx="300" cy="326" rx="125" ry="14" fill="#3D291D" opacity="0.15"/>

  <!-- Cake Body -->
  <g filter="url(#shadow)">
    <!-- Base Cylinder -->
    <path d="M180 230 C180 280 180 300 180 320 C180 340 420 340 420 320 L420 230 Z" fill="url(#cakeFrosting)"/>
    <!-- Base Top Ellipse -->
    <ellipse cx="300" cy="230" rx="120" ry="24" fill="#FFF8EE"/>
    
    <!-- Rosewater Pink Cream Layer Detail -->
    <path d="M180 265 Q240 280 300 270 Q360 280 420 265 L420 285 Q360 300 300 290 Q240 300 180 285 Z" fill="#FADCD9" opacity="0.6"/>
    <!-- Delicate Ganache Drip -->
    <path d="M180 230 Q200 255 210 240 Q225 270 240 235 Q260 275 275 235 Q300 280 325 235 Q350 270 370 240 Q395 265 420 230 Z" fill="#C2785C" opacity="0.3"/>
  </g>

  <!-- Berries & Floral Accents on Top -->
  <!-- Strawberries & Raspberries -->
  <g>
    <!-- Central Strawberry -->
    <path d="M300 180 C280 180 275 205 300 225 C325 205 320 180 300 180 Z" fill="url(#berryGrad)"/>
    <circle cx="295" cy="195" r="1.5" fill="#FFE3E0"/>
    <circle cx="305" cy="197" r="1.5" fill="#FFE3E0"/>
    <circle cx="300" cy="207" r="1.5" fill="#FFE3E0"/>
    <!-- Leaves -->
    <path d="M300 180 Q290 170 280 174 Q295 180 300 180 Q305 170 320 174 Q305 180 300 180 Z" fill="#588157"/>

    <!-- Left Raspberry -->
    <ellipse cx="260" cy="215" rx="18" ry="16" fill="url(#raspberryGrad)"/>
    <circle cx="254" cy="210" r="4" fill="#FF758F"/>
    <circle cx="265" cy="210" r="4" fill="#FF758F"/>
    <circle cx="260" cy="220" r="4" fill="#FF758F"/>

    <!-- Right Blueberries -->
    <circle cx="340" cy="215" r="12" fill="#2B2D42"/>
    <circle cx="343" cy="212" r="3" fill="#8D99AE"/>
    <circle cx="360" cy="225" r="10" fill="#3D3A45"/>
    <circle cx="362" cy="223" r="2.5" fill="#8D99AE"/>

    <!-- Cream Swirls -->
    <ellipse cx="230" cy="225" rx="14" ry="10" fill="#FFFFFF"/>
    <ellipse cx="375" cy="230" rx="14" ry="10" fill="#FFFFFF"/>

    <!-- Edible Flowers -->
    <circle cx="240" cy="205" r="7" fill="#F4A261"/>
    <circle cx="240" cy="205" r="3" fill="#E76F51"/>
    <circle cx="360" cy="200" r="7" fill="#F28482"/>
    <circle cx="360" cy="200" r="3" fill="#D90429"/>

    <!-- Gold Leaf Flakes -->
    <polygon points="315,190 320,185 323,192 318,195" fill="#E9C46A"/>
    <polygon points="270,225 275,222 278,228 272,230" fill="#E9C46A"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(420, 30)">
    <rect width="150" height="34" rx="17" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="75" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#C2785C" text-anchor="middle">★ BESTSELLER</text>
  </g>
</svg>
